<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@350;400;450;500;550;600;650;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .error-section {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 12rem 2rem 6rem;
      text-align: center;
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .error-code {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.5rem;
    }
    .error-section h1 {
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.1;
      margin-bottom: 1rem;
    }
    .error-section h1 span { color: var(--accent); }
    .error-section p {
      font-size: 1rem;
      color: var(--text-body);
      line-height: 1.7;
      max-width: 440px;
      margin: 0 auto 2.5rem;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
  </style>
</head>
<body>

  <nav class="nav scrolled">
    <div class="nav-inner">
      <a href="/" class="nav-logo">pardeep<span>builds</span></a>
      <div class="nav-links" id="navLinks">
        <a href="/">Home</a>
        <a href="/blog">Blog</a>
        <a href="/#contact">Contact</a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main>
    <section class="error-section">
      <div class="error-code">404 — Page Not Found</div>
      <h1>This page doesn't exist.<br><span>Yet.</span></h1>
      <p>The page you're looking for has moved, been deleted, or never existed. Let's get you back on track.</p>
      <div class="error-actions">
        <a href="/" class="btn btn-primary">Go home</a>
        <a href="/blog" class="btn btn-ghost">Read the blog</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Pardeep Dhingra. Built with curiosity.</p>
  </footer>

  <script>
    const toggle = document.getElementById('navToggle');
    const links = document.getElementById('navLinks');
    toggle.addEventListener('click', () => links.classList.toggle('open'));
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', () => links.classList.remove('open')));
  </script>
</body>
</html>
